        abbrechen btn behält änderungen trotzdem bei, wahrscheinlich andere art von data binding notwendig
        

-->

<div class="container-fluid mt-5">
  <div class="row">

    <!-- linker Seitenrand -->
    <div class="col-2"></div>

    <!-- Hauptbereich -->
    <div class="col-10">
      <div class="row">

        <!-- linker Hauptteil (größer) -->
        <div class="col-7 p-5 bg-light">
            <h2 class="mb-4">Meine Todos</h2>
            
           

            <div class="list-group">

            @for(todo of todos(); track todo.id){
    
                @if(editingTodoId !== todo.id) {
                    <!-- DISPLAY MODE -->
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="form-check">
                                <input 
                                    class="form-check-input" 
                                    type="checkbox" 
                                    [checked]="todo.done">

                                <label class="form-check-label fw-semibold"
                                    [ngClass]="todo.done == true ? 'text-decoration-line-through' : ''">
                                    {{ todo.title }}
                                </label>
                            </div>

                            <button class="btn btn-sm btn-outline-secondary" (click)="startEdit(todo.id)">
                                Bearbeiten
                            </button>
                        </div>

                        <small class="text-muted d-block ms-4 mt-1">
                            {{ todo.description}}
                        </small>

                        <small class="text-muted ms-4">
                            {{ todo.deadline}}
                        </small>
                    </div>
                }
                
                @if(editingTodoId === todo.id) {
                    <!-- EDIT MODE -->
                     <form [formGroup]="tempTodo">
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="form-check flex-grow-1">
                                <input class="form-check-input" type="checkbox" formControlName="done">

                                <input
                                    class="form-control form-control-sm fw-semibold ms-4 w-50"
                                    formControlName="title"
                                />
                            </div>

                            <button
                                class="btn btn-sm btn-outline-success ms-2"
                                (click)="saveEdit()"
                            >
                                Speichern
                            </button>

                            <button
                                class="btn btn-sm btn-outline-danger ms-2"
                                (click)="cancelEdit()"
                            >
                                Abbrechen
                            </button>
                        </div>

                        <textarea
                            class="form-control form-control-sm ms-5 mt-2 w-75"
                            rows="2"
                            placeholder="Description"
                            formControlName="description"
                        ></textarea>

                        <input
                            type="date"
                            class="form-control form-control-sm ms-5 mt-2 w-auto"
                            formControlName="deadline"
                        />
                    </div>
                    </form>
                }
}

            
            </div>


        </div>

        <!-- rechter Hauptteil (kleiner) -->
        <div class="col-4 p-5 ">
          <div class="border rounded p-4 bg-white shadow-sm">
            <h3 class="mb-4">Neues Todo</h3>

            <form [formGroup] = "todoForm" (ngSubmit)="this.create()">
                <div class="mb-3">
                <label class="form-label">Titel</label>
                <input type="text" class="form-control" formControlName="title" placeholder="z. B. Angular lernen">
                </div>

                <div class="mb-3">
                <label class="form-label">Beschreibung</label>
                <textarea class="form-control" rows="2" formControlName="description" placeholder="Optional"></textarea>
                </div>

                <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="hasDeadline">
                <label class="form-check-label" for="hasDeadline">
                    Deadline hinzufügen
                </label>
                </div>

                <div class="mb-4">
                <input type="date" class="form-control" formControlName="deadline" >
                </div>

                <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="done">
                <label class="form-check-label" for="done">
                    Bereits erledigt
                </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                Todo speichern
                </button>
            </form>
            </div>

        </div>

      </div>
    </div>

    <!-- rechter Seitenrand -->
    <div class="col-1"></div>

  </div>
</div>
